<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Flag</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #33ff33;
      font-family: 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .box {
      border: 1px solid #33ff33;
      padding: 2rem 3rem;
      box-shadow: 0 0 20px #33ff3333;
      text-align: center;
    }
    h1 { font-size: 1rem; letter-spacing: 3px; margin-bottom: 1.2rem; color: #aaa; }
    .flag {
      font-size: 1.1rem;
      background: #111;
      padding: 0.6rem 1.2rem;
      border: 1px solid #33ff3366;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
<div class="box">
  <h1>// CONFIDENTIAL //</h1>
  <div class="flag">FLAG_PLACEHOLDER</div>
</div>
</body>
</html>
